name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run goreleaser in snapshot mode without publishing anything"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Check release ref
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "❌ A real release must run from a v* tag, got ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}. Push a tag or re-run with dry_run."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # mise.toml pins go, goreleaser, and quill.
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          cache: true

      - name: Cache Go modules and build
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          QUILL_SIGN_P12: ${{ secrets.QUILL_SIGN_P12 }}
          QUILL_SIGN_PASSWORD: ${{ secrets.QUILL_SIGN_PASSWORD }}
          QUILL_NOTARY_KEY: ${{ secrets.QUILL_NOTARY_KEY }}
          QUILL_NOTARY_KEY_ID: ${{ secrets.QUILL_NOTARY_KEY_ID }}
          QUILL_NOTARY_ISSUER: ${{ secrets.QUILL_NOTARY_ISSUER }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            ORCHARD_SKIP_SIGN=1 goreleaser release --snapshot --clean --skip=publish
          else
            goreleaser release --clean
          fi

      - name: Smoke-test go install (post-publish)
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # End-to-end check that the published module is installable from the
          # real proxy (catches replace directives and other module-graph issues).
          # The release is already published, so a failure means "roll forward".
          echo "Waiting for goproxy to index ${VERSION}..."
          for i in $(seq 1 30); do
            if GOPROXY=https://proxy.golang.org go list -m "github.com/pthm/orchard@${VERSION}" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          bindir="$(mktemp -d)"
          if ! GOBIN="$bindir" GOPROXY=https://proxy.golang.org go install "github.com/pthm/orchard@${VERSION}"; then
            echo "❌ 'go install github.com/pthm/orchard@${VERSION}' FAILED. Roll forward with a fix."
            exit 1
          fi
          if ! "$bindir/orchard" version | grep -qF "${VERSION#v}"; then
            echo "❌ installed binary did not report ${VERSION}:"
            "$bindir/orchard" version
            exit 1
          fi
          echo "✓ go install github.com/pthm/orchard@${VERSION} works: $("$bindir/orchard" version | head -1)"
