baseURL: https://orchard.pthm.dev/
title: Orchard
defaultContentLanguage: en

enableGitInfo: true
enableRobotsTXT: true
disablePathToLower: true

module:
  imports:
    - path: github.com/imfing/hextra
  hugoVersion:
    extended: true
    min: "0.158.0"
  # Mount content-generated/ on top of content/ so generator output
  # for providers (postgres, mysql, sqlite, http, exec) lands at the same URLs as
  # hand-written pages. The generated tree is gitignored; run
  # `just docs-generate` before `hugo build`.
  mounts:
    - source: content
      target: content
    - source: content-generated
      target: content

# Machine-readable outputs: /llms.txt indexes the docs for LLM agents,
# /llms-full.txt is every docs page in one file, and every page gets a
# markdown twin at <page>.md (layouts/_partials/llms/markdown-body.html).
outputFormats:
  llmsfull:
    baseName: llms-full
    mediaType: text/plain
    isPlainText: true

outputs:
  home: [HTML, RSS, llms, llmsfull]
  page: [HTML, markdown]
  section: [HTML, RSS, markdown]

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
  highlight:
    noClasses: false

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: API Reference
      pageRef: /reference
      weight: 2
    - name: Providers
      pageRef: /providers
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/pthm/orchard"
      params:
        icon: github

params:
  description: Seed more than your database. Orchard builds application state from reusable HCL components using the tools you already have (databases, APIs, and scripts) for demos, tests, and local development.

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/orchard-dark.png
      dark: images/orchard-light.png
      width: 124
      height: 24
    width: wide

  page:
    width: wide
    # "Copy page" menu on docs pages: copy or view the page's Markdown twin,
    # or hand it to an assistant. Placeholders are URL-encoded by Hextra.
    contextMenu:
      enable: true
      links:
        - name: Open in Claude
          icon: simple:claude
          url: "https://claude.ai/new?q=Read%20{markdown_url}%20so%20I%20can%20ask%20questions%20about%20it."
        - name: Open in ChatGPT
          icon: lucide:message-circle
          url: "https://chatgpt.com/?q=Read%20{markdown_url}%20so%20I%20can%20ask%20questions%20about%20it."

  footer:
    displayCopyright: false
    displayPoweredBy: true
    width: wide

  editURL:
    enable: true
    base: "https://github.com/pthm/orchard/edit/main/docs/content"

  comments:
    enable: false
