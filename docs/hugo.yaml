baseURL: https://orchard.pthm.dev/
title: Orchard
defaultContentLanguage: en

enableGitInfo: true
enableRobotsTXT: true
disablePathToLower: true

module:
  imports:
    - path: github.com/imfing/hextra
  hugoVersion:
    extended: true
    min: "0.158.0"
  # Mount content-generated/ on top of content/ so generator output
  # for providers (postgres, http, exec) lands at the same URLs as
  # hand-written pages. The generated tree is gitignored; run
  # `just docs-generate` before `hugo build`.
  mounts:
    - source: content
      target: content
    - source: content-generated
      target: content

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
  highlight:
    noClasses: false

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: "https://github.com/pthm/orchard"
      params:
        icon: github

params:
  description: Define reproducible application state as code. Compose scenarios in HCL and Orchard builds them — database rows, API calls, scripts — wiring outputs between steps.

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/orchard-dark.png
      dark: images/orchard-light.png
      width: 124
      height: 24
    width: wide

  page:
    width: wide

  footer:
    displayCopyright: false
    displayPoweredBy: true
    width: wide

  editURL:
    enable: true
    base: "https://github.com/pthm/orchard/edit/main/docs/content"

  comments:
    enable: false
