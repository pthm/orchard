{{ if default true .Site.Params.BookSearch }}
<div class="orchard-search">
  <div class="orchard-search-bar">
    <input id="book-search-input" type="text"
      placeholder="Search docs..."
      aria-label="Search documentation"
      maxlength="64" data-hotkeys="s/" autocomplete="off" />
    <div class="book-search-spinner hidden"></div>
    <kbd class="orchard-search-hint">s</kbd>
  </div>
  <div id="book-search-results" class="orchard-search-results hidden"></div>
</div>
<script>
  // Show the search bar (hidden by default for no-JS)
  document.querySelector('.orchard-search').style.display = 'block';
</script>
{{ end }}
